[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo"
version = "0.1.0"
description = "find and remove duplicate files by content hash"
requires-python = ">=3.11"
dependencies = ["click>=8", "rich>=13"]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
